<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="description" content="MY MORNING – arjen rutiinit ja viikkotehtävät">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>MY MORNING</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#202126;--panel2:#292b31;--muted:#a1a1aa;--blue:#00bfff;--line:#41434a;--good:#15313d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
main{max-width:560px;margin:auto;padding:18px 0 36px}.top{display:flex;align-items:center;justify-content:space-between;margin:5px 3px 18px}.brand{font-size:27px;font-weight:900;letter-spacing:1.4px;color:var(--blue)}.sub{font-size:10px;color:var(--muted);letter-spacing:1.4px;margin-top:3px}.clock{background:var(--panel);padding:9px 13px;border-radius:12px;text-align:center}.clock strong{display:block;color:var(--blue);font-size:20px}.clock span{font-size:9px;color:var(--muted);letter-spacing:1px}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:0 0 18px}nav button{background:var(--panel);border:1px solid var(--line);border-radius:11px;color:#ddd;padding:10px 3px;font-size:10px;font-weight:700}nav button.active{background:var(--good);border-color:var(--blue);color:var(--blue)}nav button span{display:block;font-size:17px;margin-bottom:4px}
h1{font-size:21px;margin:8px 2px 14px}h2{font-size:16px;margin:0 0 12px}.muted{color:var(--muted);font-size:12px;line-height:1.5}.panel{background:var(--panel);border-radius:15px;padding:15px;margin-bottom:13px}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.tasklist{display:grid;gap:8px}.task{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid transparent;border-radius:12px;padding:13px;min-height:58px;cursor:pointer}.task.done{background:#17252c;border-color:#24546a}.task .name{font-size:14px;font-weight:650;flex:1}.task.done .name{text-decoration:line-through;color:#aebdc4}.meta{font-size:11px;color:var(--muted);margin-top:4px}.check{width:25px;height:25px;border:2px solid #777980;border-radius:50%;display:grid;place-items:center;flex:none;color:#101114;font-weight:900}.done .check{background:var(--blue);border-color:var(--blue)}
.btn{background:var(--panel2);border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px 13px;font-size:13px;font-weight:650}.btn.primary{background:#103344;border-color:var(--blue);color:var(--blue)}.btn.danger{color:#ff9b9b}.field{width:100%;background:#15161a;border:1px solid var(--line);border-radius:10px;padding:11px;color:#fff;font:inherit;font-size:14px}.field:focus{outline:2px solid var(--blue);border-color:var(--blue)}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions>*{flex:1}.pill{font-size:10px;color:var(--blue);background:#102a38;padding:4px 8px;border-radius:20px}.daycard{display:block;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:8px;width:100%;text-align:left;color:#fff}.daycard strong{display:block;font-size:14px}.daycard small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.progress{height:7px;background:var(--line);border-radius:20px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:var(--blue)}.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px;background:var(--panel);border-radius:12px}.success{background:var(--good);border:1px solid var(--blue);padding:16px;border-radius:13px;text-align:center;margin-top:12px;color:var(--blue);font-weight:750}.item-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item-row:last-child{border:0}.small{font-size:11px;color:var(--muted)}footer{text-align:center;color:#777980;font-size:10px;letter-spacing:1px;margin-top:24px}
</style>
</head>
<body><main>
<header class="top"><div><div class="brand">MY MORNING</div><div class="sub">OMA ARJEN RUTIINI</div></div><div class="clock"><strong id="wakeDisplay">07:00</strong><span>HERÄTYS</span></div></header>
<nav id="nav">
<button class="active" data-tab="morning"><span>☀️</span>Aamu</button>
<button data-tab="evening"><span>🌙</span>Ilta</button>
<button data-tab="week"><span>📅</span>Viikko</button>
<button data-tab="track"><span>⭐</span>Seuranta</button>
<button data-tab="settings"><span>⚙️</span>Asetukset</button>
</nav>
<section id="view"></section><footer>MY MORNING · MUSTA · HARMAA · NEON SININEN</footer>
</main>
<script>
const $=s=>document.querySelector(s);
const days=['Maanantai','Tiistai','Keskiviikko','Torstai','Perjantai','Lauantai','Sunnuntai'];
const morning=[['🛏️','Herää ja petaa sänky'],['🚿','Käy vessassa ja pese kasvot'],['👕','Pukeudu päivän vaatteisiin'],['🥣','Syö aamupala'],['💊','Ota aamun lääke'],['🪥','Pese hampaat'],['🎒','Tarkista koulureppu'],['🧥','Pue ulkovaatteet'],['🚪','Valmis lähtemään!']];
const evening=[['🧺','Laita tavarat paikoilleen'],['🎒','Valmistele koulureppu'],['👕','Valitse huomisen vaatteet'],['🪥','Pese hampaat'],['🚿','Iltapesut'],['📚','Rauhoitu ja käy nukkumaan']];
const fresh=()=>({wake:'07:00',morning:morning.map(x=>({emoji:x[0],name:x[1]})),evening:evening.map(x=>({emoji:x[0],name:x[1]})),library:[],weeks:{},morningDone:{},eveningDone:{}});
let data=fresh();try{data={...data,...JSON.parse(localStorage.getItem('myMorningApp')||'{}')}}catch(e){}
data.library=data.library||[];data.weeks=data.weeks||{};data.morningDone=data.morningDone||{};data.eveningDone=data.eveningDone||{};
const save=()=>{try{localStorage.setItem('myMorningApp',JSON.stringify(data))}catch(e){}};
const weekKey=()=>{let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10)};
const wk=weekKey();if(!data.weeks[wk])data.weeks[wk]={days:Array.from({length:7},()=>[])};
let tab='morning',dayOpen=null,planDay=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function routineView(k){const list=data[k],done=data[k+'Done'];const n=list.filter((_,i)=>done[i]).length;return `<h1>${k==='morning'?'☀️ Aamurutiini':'🌙 Iltarutiini'}</h1><div class="panel"><div class="row between"><b>Tehtävien eteneminen</b><span class="pill">${n}/${list.length} tehty</span></div><div class="progress"><i style="width:${list.length?n/list.length*100:0}%"></i></div></div><div class="tasklist">${list.map((t,i)=>`<div class="task ${done[i]?'done':''}" data-routine="${i}"><div class="check">${done[i]?'✓':''}</div><div class="grow"><div class="name">${esc(t.name)}</div>${k==='morning'&&i===4?'<div class="meta">Kuittaa lääke vasta ottamisen jälkeen sovitun ohjeen mukaan.</div>':''}</div></div>`).join('')}</div>${n===list.length&&list.length?'<div class="success">🏆 Mahtavaa! Kaikki tehtävät tehty! 💙</div>':''}<div class="actions"><button class="btn" id="routineReset">↻ Aloita alusta</button></div>${k==='morning'?'<p class="muted">Huom! Sovellus ei soita herätyskelloa. Aseta varsinainen hälytys iPhonen Kello-sovelluksessa.</p>':''}`}
function weekView(){const w=data.weeks[wk];return `<h1>📅 Viikkotehtävät</h1><div class="panel"><b>Viikon suunnitelma</b><p class="muted">Avaa haluamasi päivä nähdäksesi sen tehtävät. Voit suunnitella viikon uudelleen sunnuntaisin.</p></div>${days.map((d,i)=>{const a=w.days[i]||[],n=a.filter(t=>t.done).length;return `<button class="daycard" data-day="${i}"><div class="row between"><strong>${d}</strong><span class="pill">${n}/${a.length} tehty</span></div><small>${a.length?a.map(t=>esc(t.name)).join(' · '):'Ei vielä tehtäviä'}</small><div class="progress"><i style="width:${a.length?n/a.length*100:0}%"></i></div></button>`}).join('')}<div class="actions"><button class="btn primary" id="planOpen">✏️ Suunnittele viikko</button></div>`}
function dayView(i){const a=data.weeks[wk].days[i]||[];return `<div class="row between"><button class="btn" id="back">← Viikko</button><span class="pill">${a.filter(t=>t.done).length}/${a.length} tehty</span></div><h1>${days[i]}</h1>${a.length?`<div class="tasklist">${a.map((t,j)=>`<div class="task ${t.done?'done':''}" data-week-task="${j}"><div class="check">${t.done?'✓':''}</div><div class="grow"><div class="name">${esc(t.name)}</div><div class="meta">${esc(t.assignee||'Vastuuhenkilöä ei merkitty')}${t.duration?' · '+esc(t.duration)+' min':''}</div></div></div>`).join('')}</div>${a.every(t=>t.done)?'<div class="success">🌟 Kaikki päivän tehtävät tehty! Mahtavaa! 💙</div>':''}`:'<div class="empty">Tälle päivälle ei ole vielä tehtäviä.</div>'}`}
function plannerView(){const a=data.weeks[wk].days[planDay];return `<div class="row between"><h1>✏️ Viikon suunnittelu</h1><button class="btn" id="planDone">Valmis</button></div><p class="muted">Valitse päivä ja lisää tehtäviä omasta tehtävävalikostasi.</p><label>Viikonpäivä</label><select class="field" id="planDay">${days.map((d,i)=>`<option value="${i}" ${i===planDay?'selected':''}>${d}</option>`).join('')}</select><div class="panel" style="margin-top:12px"><b>${days[planDay]} – valitut tehtävät</b>${a.length?a.map((t,j)=>`<div class="item-row"><div class="grow"><b>${esc(t.name)}</b><div class="small">${esc(t.assignee||'Ei vastuuhenkilöä')}${t.duration?' · '+esc(t.duration)+' min':''}</div></div><button class="btn danger" data-remove="${j}">Poista</button></div>`).join(''):'<p class="muted">Ei vielä tehtäviä.</p>'}</div><div class="panel"><b>Lisää tehtävä</b><label>Tehtävävalikko</label><select class="field" id="pick"><option value="">Valitse tehtävä</option>${data.library.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('')}</select><label>Vastuuhenkilö</label><input class="field" id="assignee" placeholder="Kirjoita nimi"><label>Arvioitu kesto</label><select class="field" id="duration"><option value="">Ei määritetty</option>${[5,10,15,20,30,45,60,75,90].map(n=>`<option value="${n}">${n} minuuttia</option>`).join('')}</select><div class="actions"><button class="btn primary" id="addTask">+ Lisää päivälle</button></div>${data.library.length?'':'<p class="muted">Lisää ensin omia tehtäviä Asetukset-välilehdellä.</p>'}</div>`}
function settingsView(){return `<h1>⚙️ Asetukset</h1><div class="panel"><b>Aamun herätysaika</b><label>Herätysaika</label><input class="field" type="time" id="wake" value="${esc(data.wake)}"><p class="muted">Tämä näyttää herätysajan sovelluksessa. Se ei soita hälytystä; aseta varsinainen hälytys iPhonen Kello-sovelluksessa.</p></div><div class="panel"><b>Oma tehtävävalikko</b><p class="muted">Rakenna valikko itse. Voit lisätä, muokata ja poistaa tehtäviä.</p><label>Uuden tehtävän nimi</label><input class="field" id="newName" placeholder="Kirjoita kotityö"><div class="actions"><button class="btn primary" id="addLibrary">+ Lisää tehtävävalikkoon</button></div>${data.library.length?data.library.map((t,i)=>`<div class="item-row"><b class="grow">${esc(t.name)}</b><button class="btn" data-edit="${i}">Muokkaa</button><button class="btn danger" data-delete="${i}">Poista</button></div>`).join(''):'<div class="empty" style="margin-top:12px">Tehtävävalikko on tyhjä. Lisää siihen itse haluamasi tehtävät.</div>'}</div><div class="panel"><b>Viikon suunnittelu</b><p class="muted">Voit suunnitella viikon sunnuntaina tai muulloin tarvittaessa.</p><button class="btn primary" id="settingsPlan">Avaa viikkosuunnittelu</button></div>`}
function trackView(){const w=data.weeks[wk],n=w.days.flat().filter(t=>t.done).length;return `<h1>⭐ Seuranta</h1><div class="panel"><b>Tämän viikon onnistumiset</b><p class="muted">Valmiiksi kuitattuja kotitöitä: ${n}</p></div><div class="panel"><b>Muista</b><p class="muted">Jokainen tehty asia on onnistuminen. Pienetkin edistysaskeleet ovat tärkeitä! 💙</p></div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#wakeDisplay').textContent=data.wake||'07:00';if(tab==='morning'||tab==='evening')$('#view').innerHTML=routineView(tab);else if(tab==='week')$('#view').innerHTML=dayOpen==='planner'?plannerView():dayOpen===null?weekView():dayView(dayOpen);else if(tab==='settings')$('#view').innerHTML=settingsView();else $('#view').innerHTML=trackView();bind()}
function openPlanner(){tab='week';dayOpen='planner';planDay=0;render()}
function bind(){
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;dayOpen=null;render()});
document.querySelectorAll('[data-routine]').forEach(el=>el.onclick=()=>{let k=tab,i=Number(el.dataset.routine);data[k+'Done'][i]=!data[k+'Done'][i];save();render()});
if($('#routineReset'))$('#routineReset').onclick=()=>{data[tab+'Done']={};save();render()};
document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{dayOpen=Number(b.dataset.day);render()});
if($('#back'))$('#back').onclick=()=>{dayOpen=null;render()};
if($('#planOpen'))$('#planOpen').onclick=openPlanner;if($('#settingsPlan'))$('#settingsPlan').onclick=openPlanner;
if($('#planDone'))$('#planDone').onclick=()=>{dayOpen=null;render()};
if($('#planDay'))$('#planDay').onchange=e=>{planDay=Number(e.target.value);render()};
if($('#addTask'))$('#addTask').onclick=()=>{let v=$('#pick').value;if(v===''){alert('Valitse tehtävä valikosta.');return}let t=data.library[Number(v)];data.weeks[wk].days[planDay].push({id:String(Date.now())+Math.random(),name:t.name,assignee:$('#assignee').value.trim(),duration:$('#duration').value,done:false});save();render()};
document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{data.weeks[wk].days[planDay].splice(Number(b.dataset.remove),1);save();render()});
document.querySelectorAll('[data-week-task]').forEach(el=>el.onclick=()=>{let t=data.weeks[wk].days[dayOpen][Number(el.dataset.weekTask)];t.done=!t.done;save();render()});
if($('#wake'))$('#wake').onchange=e=>{data.wake=e.target.value||'07:00';save();render()};
if($('#addLibrary'))$('#addLibrary').onclick=()=>{let n=$('#newName').value.trim();if(!n)return;data.library.push({name:n});save();render()};
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{data.library.splice(Number(b.dataset.delete),1);save();render()});
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.edit),n=prompt('Muokkaa tehtävän nimeä:',data.library[i].name);if(n&&n.trim()){data.library[i].name=n.trim();save();render()}});
}
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
